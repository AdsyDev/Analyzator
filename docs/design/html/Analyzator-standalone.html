  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

u002Fspan>\n      <span style=\"display:inline-flex; gap:6px; align-items:center; white-space:nowrap\">Payload <span title=\"{{ dr.ev.hashFull }}\" style=\"font:500 11.5px/1 'JetBrains Mono',monospace; white-space:nowrap; color:var(--text)\">{{ dr.ev.hash }}<\u002Fspan><\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ copyHash }}\" style=\"display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:500 12px/1 'Onest',sans-serif; cursor:pointer\" style-hover=\"background:var(--surface-2)\" style-active=\"transform:scale(0.97)\"><i class=\"ph ph-copy\"><\u002Fi>Copiază hash<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Faside>\n\n<div sc-camel-on-click=\"{{ closeSetup }}\" aria-hidden=\"true\" style=\"position:fixed; inset:0; z-index:42; background:var(--scrim); backdrop-filter:blur(5px) saturate(115%); -webkit-backdrop-filter:blur(5px) saturate(115%); opacity:{{ setupScrimOp }}; pointer-events:{{ setupPE }}; transition:opacity 260ms ease\"><\u002Fdiv>\n<aside role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ su.title }}\" aria-hidden=\"{{ setupHidden }}\" style=\"position:fixed; top:12px; right:12px; bottom:12px; width:min(560px, calc(100vw - 120px)); z-index:43; display:flex; flex-direction:column; border-radius:16px; background:var(--glass-thick); backdrop-filter:blur(40px) saturate(170%); -webkit-backdrop-filter:blur(40px) saturate(170%); border:1px solid var(--glass-border); box-shadow:var(--sh-drawer); transform:{{ setupTf }}; visibility:{{ setupVis }}; transition:{{ setupTr }}; overflow:hidden\">\n  <div style=\"padding:20px 20px 18px; display:flex; flex-direction:column; gap:20px; border-bottom:1px solid var(--glass-border)\">\n    <div style=\"display:flex; align-items:flex-start; gap:12px\"><span style=\"flex:none; width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-text)\"><i class=\"{{ su.icon }}\" style=\"font-size:19px\"><\u002Fi><\u002Fspan><div style=\"display:flex; flex-direction:column; gap:6px; flex:1\"><h2 style=\"margin:0; font:600 19px/1.25 'Sora',sans-serif; letter-spacing:-0.01em\">{{ su.title }}<\u002Fh2><span style=\"font:400 13px/1.45 'Onest',sans-serif; color:var(--text-2); text-wrap:pretty\">{{ su.subtitle }}<\u002Fspan><\u002Fdiv><button type=\"button\" sc-camel-on-click=\"{{ closeSetup }}\" aria-label=\"Închide\" style=\"width:32px; height:32px; border-radius:10px; border:0; background:transparent; color:var(--text); display:grid; place-items:center; cursor:pointer\" style-hover=\"background:var(--nav-hover)\"><i class=\"ph ph-x\" style=\"font-size:16px\"><\u002Fi><\u002Fbutton><\u002Fdiv>\n    <ol aria-label=\"Etape\" style=\"display:flex; align-items:center; gap:8px; margin:0; padding:0; list-style:none\">\n      <sc-for list=\"{{ su.steps }}\" as=\"s\"><li aria-current=\"{{ s.aria }}\" style=\"display:flex; align-items:center; gap:8px; flex:{{ s.flex }}\"><span style=\"flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:{{ s.bg }}; color:{{ s.fg }}; border:1.5px solid {{ s.border }}; font:600 11.5px/1 'Onest',sans-serif; transition:background-color 200ms ease, color 200ms ease, border-color 200ms ease\"><sc-if value=\"{{ s.done }}\"><i class=\"ph-bold ph-check\" style=\"font-size:11px\"><\u002Fi><\u002Fsc-if><sc-if value=\"{{ s.notDone }}\">{{ s.n }}<\u002Fsc-if><\u002Fspan><span style=\"font:500 12.5px/1 'Onest',sans-serif; color:{{ s.lc }}; white-space:nowrap\">{{ s.label }}<\u002Fspan><sc-if value=\"{{ s.line }}\"><span style=\"flex:1; min-width:12px; height:1.5px; border-radius:1px; background:{{ s.lineC }}; transition:background-color 200ms ease\"><\u002Fspan><\u002Fsc-if><\u002Fli><\u002Fsc-for>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div data-setup-body=\"\" style=\"flex:1; min-heig ); font:400 14px/1 'Onest',sans-serif; outline:none; transition:border-color 160ms ease, box-shadow 160ms ease; border:1px solid var(--border-strong)\" style-focus=\"border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)\"><span style=\"font:400 12px/1.45 'Onest',sans-serif; color:var(--text-2)\">Primesc notificarea imediat ce cineva marchează o mențiune. Poți adăuga mai multe adrese, separate prin virgulă.<\u002Fspan><\u002Flabel><\u002Fsc-if>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ su.isSite }}\">\n      <sc-if value=\"{{ su.siteMode }}\"><div style=\"display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font:400 13px/1 'Onest',sans-serif\"><i class=\"ph ph-buildings\" style=\"font-size:16px; color:var(--text-2)\"><\u002Fi><span style=\"color:var(--text-2)\">Client<\u002Fspan><span style=\"font-weight:600\">{{ su.clientName }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font:600 13px/1 'Onest',sans-serif; color:var(--text)\">Numele brandului<\u002Fspan><input value=\"{{ su.brand }}\" sc-camel-on-change=\"{{ su.setBrand }}\" style=\"height:42px; width:100%; padding:0 12px; border-radius:10px; background:var(--surface); color:var(--text); font:400 14px/1 'Onest',sans-serif; outline:none; transition:border-color 160ms ease, box-shadow 160ms ease; border:1px solid var(--border-strong)\" style-focus=\"border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)\"><span style=\"font:400 12px/1.45 'Onest',sans-serif; color:var(--text-2)\">Devine numele spațiului de brand din selectorul din topbar.<\u002Fspan><\u002Flabel>\n      <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font:600 13px/1 'Onest',sans-serif; color:var(--text)\">Domeniul site-ului<\u002Fspan><div style=\"display:flex; align-items:stretch; border-radius:10px; border:1px solid var(--border-strong); background ms ease, box-shadow 160ms ease; height:38px; border:1px solid var(--border-strong)\" style-focus=\"border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)\"><\u002Fdiv><\u002Fsc-for><span style=\"font:400 12px/1.45 'Onest',sans-serif; color:var(--text-2)\">Setul primește versiunea v1, cu data de azi ca dată efectivă. Îl poți schimba ulterior.<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ su.isSources }}\">\n      <p style=\"margin:0; font:400 13.5px/1.5 'Onest',sans-serif; color:var(--text-2); text-wrap:pretty\">Conectează acum ce ai la îndemână. Indicatorii care depind de o sursă neconectată apar ca indisponibili, fără valori estimate.<\u002Fp>\n      <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden\">\n        <sc-for list=\"{{ su.conns }}\" as=\"cn\"><div style=\"display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 14px; border-top:1px solid var(--border)\"><span style=\"flex:none; width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--border)\"><sc-if value=\"{{ cn.hasImg }}\"><span aria-hidden=\"true\" style=\"width:16px; height:16px; background:{{ cn.imgBg }} center / contain no-repeat\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ cn.hasMono }}\"><span style=\"font:700 12px/1 'Sora',sans-serif; color:var(--text-2)\">{{ cn.mono }}<\u002Fspan><\u002Fsc-if><\u002Fspan><span style=\"flex:1; font:500 13.5px/1.2 'Onest',sans-serif\">{{ cn.name }}<\u002Fspan><sc-if value=\"{{ cn.off }}\"><button type=\"button\" sc-camel-on-click=\"{{ cn.toggle }}\" style=\"display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:500 13px/1 'Onest',sans-serif; cursor:pointer; transition:background-color 160ms ease, transform 120ms ease; height:30px; font-size:12.5px\" style-hover=\"background:var(--surface-2)\" style-active=\"transform:scale(0.97)\"><i class=\"ph ph-plugs-connected\"><\u002Fi>Conectează<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ cn.on }}\"><button type=\"button\" sc-camel-on-click=\"{{ cn.toggle }}\" style=\"display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:10px; border:0; background:var(--pos-soft); color:var(--pos-text); font:600 12.5px/1 'Onest',sans-serif; cursor:pointer\"><i class=\"ph-bold ph-check\"><\u002Fi>Conectat<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font:400 12.5px/1 'Onest',sans-serif; color:var(--text-2)\"><span style=\"font-family:'JetBrains Mono',monospace; color:var(--text)\">{{ su.connCount }}<\u002Fspan> din 8 surse conectate<\u002Fspan>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ su.isAccess }}\">\n      <p style=\"margin:0; font:400 13.5px/1.5 'Onest',sans-serif; color:var(--text-2); text-wrap:pretty\">Invitațiile pleacă pe email și sunt valabile 7 zile. Cititorii văd doar analizele publicate.<\u002Fp>\n      <sc-for list=\"{{ su.invites }}\" as=\"iv\"><div style=\"display:flex; align-items:center; gap:8px\"><input type=\"email\" value=\"{{ iv.email }}\" sc-camel-on-change=\"{{ iv.set }}\" aria-label=\"Email\" style=\"height:42px; width:100%; padding:0 12px; border-radius:10px; background:var(--surface); color:var(--text); font:400 14px/1 'Onest',sans-serif; outline:none; transition:border-color 160ms ease, box-shadow 160ms ease; height:38px; flex:1; border:1px solid var(--border-strong)\" style-focus=\"border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)\"><div style=\"flex:none; display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--neutral-soft)\"><sc-for list=\"{{ iv.roles }}\" as=\"ro\"><button type=\"button\" sc-camel-on-click=\"{{ ro.pick }}\" style=\"height:30px; padding:0 10px; border-radius:8px; border:0; background:{{ ro.bg }}; box-shadow:{{ ro.sh }}; color:{{ ro.fg }}; font:500 12  style=\"background:var(--surface); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column\">\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; padding:10px 14px; font:400 13px/1.4 'Onest',sans-serif\"><span style=\"color:var(--text-2)\">Data și ora<\u002Fspan><span style=\"font:500 12px/1.4 'JetBrains Mono',monospace; white-space:nowrap\">{{ pv.now }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; padding:10px 14px; border-top:1px solid var(--border); font:400 13px/1.4 'Onest',sans-serif\"><span style=\"color:var(--text-2)\">Utilizator<\u002Fspan><span>{{ me.name }}, {{ me.org }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; padding:10px 14px; border-top:1px solid var(--border); font:400 13px/1.4 'Onest',sans-serif\"><span style=\"color:var(--text-2)\">Link<\u002Fspan><span style=\"font:400 12px/1.4 'JetBrains Mono',monospace; word-break:break-all\">{{ pv.item.link }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; padding:10px 14px; border-top:1px solid var(--border); font:400 13px/1.4 'Onest',sans-serif\"><span style=\"color:var(--text-2)\">Snapshot text<\u002Fspan><span style=\"font-style:italic; text-wrap:pretty\">„{{ pv.item.text }}\"<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:10px; font:400 13px/1.5 'Onest',sans-serif\"><i class=\"ph ph-bell-ringing\" style=\"font-size:16px; color:var(--text-2); margin-top:2px\"><\u002Fi><span><span style=\"font-weight:600\">Ce urmează: <\u002Fspan>notificăm imediat contactele de farmacovigilență configurate pentru STADA: farmacovigilenta@stada.ro și Mihai Dumitrescu (QPPV).<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; justify-content:flex-end; gap:8px; padding-top:4px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ pvCancel }}\" style=\"height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:500 13.5px/1 'Onest',sans-serif; cursor:pointer\" style-hover=\"background:var(--surface-2)\" style-active=\"transform:scale(0.97)\">Anulează<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pvConfirm }}\" style=\"height:38px; padding:0 16px; border-radius:10px; border:0; background:var(--pv-btn); color:#FFFFFF; font:600 13.5px/1 'Onest',sans-serif; cursor:pointer; transition:transform 140ms cubic-bezier(0.23,1,0.32,1), filter 160ms ease\" style-hover=\"filter:brightness(1.08)\" style-active=\"transform:scale(0.97)\">Marchează și notifică<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div role=\"status\" aria-live=\"polite\" style=\"position:fixed; left:50%; bottom:24px; z-index:60; transform:{{ toastTf }}; opacity:{{ toastOp }}; transition:transform 320ms cubic-bezier(0.23,1,0.32,1), opacity 220ms ease; pointer-events:none; display:flex; align-items:center; gap:10px; max-width:520px; padding:12px 16px; border-radius:12px; background:var(--glass-strong); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid var(--glass-border); box-shadow:var(--sh-pop); font:500 13.5px/1.4 'Onest',sans-serif; color:var(--text)\"><i class=\"ph-fill ph-check-circle\" style=\"font-size:18px; color:var(--pos)\"><\u002Fi>{{ toastMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;agency&quot;,&quot;client&quot;],&quot;default&quot;:&quot;agency&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototip&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;overview&quot;,&quot;ai&quot;,&quot;seo&quot;,&quot;traffic&quot;,&quot;listening&quot;,&quot;competition&quot;,&quot;insights&quot;,&quot;clients&quot;,&quot;sources&quot;,&quot;paid&quot;,&quot;system&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototip&quot;},&quot;sidebarCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototip&quot;}}\">\nconst MONTHS = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sept.', 'oct.', 'nov.', 'dec.'];\nconst END = new Date(2026, 9, 5);\nconst fmtD = d => d.getDate() + ' ' + MONTHS[d.getMonth()];\nfunction hash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }\nfunction rng(seed) { let a = hash(seed); return function () { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction walk(seed, n, base, vol, drift) { const r = rng(seed); let v = base; const o = []; for (let i = 0; i < n; i++) { o.push(v); v = v * (1 + (r() - 0.5) * vol + drift); } return o; }\nconst nf = (v, d = 0) => Number(v).toLocaleString('ro-RO', { minimumFractionDigits: d, maximumFractionDigits: d });\nconst MINUS = '\\u2212';\nconst sgn = v => v > 0 ? '+' : v < 0 ? MINUS : '';\nconst T = (y, m, d) => new Date(y, m, d).getTime();\nconst GAP = { sessions: d => d >= T(2026, 8, 14) && d <= T(2026, 8, 18), stale: d => d > T(2026, 8, 29), ai: d => d === T(2026, 8, 23) || d === T(2026, 8, 24) };\nconst PERIODS = {\n  '7z': { label: 'Ultimele 7 zile', days: 7, range: '29 sept. - 5 oct. 2026' },\n  '28z': { label: 'Ultimele 28 de zile', days: 28, range: '8 sept. - 5 oct. 2026' },\n  'luna': { label: 'Luna curentă', days: 5, range: '1 - 5 oct. 2026' },\n  'interval': { label: 'Interval personalizat', days: 92, range: '1 iul. - 30 sept. 2026', end: new Date(2026, 8, 30) }\n};\nfunction axis(pid) { const p = PERIODS[pid]; const end = p.end || END; const step = p.days > 45 ? 7 : 1; const n = Math.ceil(p.days / step); const o = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(end); d.setDate(d.getDate() - i * step); o.push({ d: d.getTime(), l: fmtD(d) }); } return o; }\nfunction spark(vals) {\n  const n = vals.length, nums = vals.filter(v => v != null); if (!nums.length) return { line: '', area: '' };\n  const mn = Math.min(...nums), mx = Math.max(...nums); const X = i => n > 1 ? i / (n - 1) * 100 : 50; const Y = v => mx === mn ? 16 : 30 - (v - mn) / (mx - mn) * 26;\n  let line = '', area = '', seg = [];\n  const flush = () => { if (seg.length > 1) { line += seg.map((p, j) => (j ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ') + ' '; area += 'M' + seg[0][0].toFixed(2) + ' 32 ' + seg.map(p => 'L' + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ') + ' L' + seg[seg.length - 1][0].toFixed(2) + ' 32 Z '; } seg = []; };\n  vals.forEach((v, i) => { if (v == null) flush(); else seg.push([X(i), Y(v)]); }); flush(); return { line, area };\n}\nconst PEOPLE = {\n  ip: { name: 'Ioana Popescu', ini: 'IP', org: 'AdSymphony', role: 'Strateg SEO și AI', email: 'ioana.popescu@adsymphony.ro' },\n  rm: { name: 'Radu Matei', ini: 'RM', org: 'AdSymphony', role: 'Analist date', email: 'radu.matei@adsymphony.ro' },\n  av: { name: 'Andreea Vlad', ini: 'AV', org: 'AdSymphony', role: 'Head of Insights', email: 'andreea.vlad@adsymphony.ro' },\n  ed: { name: 'Elena Dobre', ini: 'ED', org: 'STADA', role: 'Brand Manager', email: 'elena.dobre@stada.ro' },\n  md: { name: 'Mihai Dumitrescu', ini: 'MD', org: 'STADA', role: 'QPPV', email: 'mihai.dumitrescu@stada.ro' }\n};\nconst person = id => { const p = PEOPLE[id]; const ag = p.org === 'AdSymphony'; return { ...p, avBg: ag ? 'var(--accent-soft)' : 'var(--lav-soft)', avFg: ag ? 'var(--accent-text)' : 'var(--lav-text)' }; };\nconst BRANDS = {\n  urinal: { id: 'urinal', name: 'Urinal', initial: 'U', cat: 'Sănătate urinară', f: 1, domain: 'urinal.ro', av: 'var(--accent-soft)', avf: 'var(--accent-text)', comps: ['Cistonal', 'UroFem Plus', 'Vitacran'],\n    topics: ['Prevenție ITU', 'Cistită acută', 'Merișor și D-manoză', 'ITU în sarcină', 'După antibiotic'],\n    kws: ['urinal', 'urinal akut', 'urinal pareri', 'infectie urinara tratament', 'cistita remedii', 'merisor capsule', 'd-manoza', 'arsuri la urinare', 'infectie urinara femei', 'supliment tract urinar', 'cistita in sarcina', 'urinal pret'],\n    pages: ['/', '/produse/urinal-akut', '/sfaturi/infectia-urinara', '/sfaturi/merisor-si-d-manoza', '/unde-gasesti'],\n    gaps: [['d-manoza sau merisor', 2400, 'Cistonal', 4], ['cistita dupa contact', 1900, 'UroFem Plus', 6], ['infectie urinara copii', 3600, 'Vitacran', 8], ['ceai pentru cistita', 1300, 'Cistonal', 3]] },\n  minimartieni: { id: 'minimartieni', name: 'Minimartieni', initial: 'M', cat: 'Vitamine pentru copii', f: 1.42, domain: 'minimartieni.ro', av: 'var(--lav-soft)', avf: 'var(--lav-text)', comps: ['Kidvita', 'Vitaminis Junior', 'MultiKids'],\n    topics: ['Imunitate', 'Vitamine pe vârste', 'Jeleuri cu vitamine', 'Poftă de mâncare', 'Creștere și oase'],\n    kws: ['minimartieni', 'minimartieni imunitate', 'vitamine copii', 'jeleuri vitamine copii', 'vitamina d copii', 'multivitamine copii 3 ani', 'imunitate copii gradinita', 'omega 3 copii', 'vitamine pofta de mancare copii', 'minimartieni pareri', 'vitamina c copii', 'minimartieni pret'],\n    pages: ['/', '/produse/minimartieni-imunitate', '/sfaturi/vitamine-pe-varste', '/sfaturi/imunitate-gradinita', '/unde-gasesti'],\n    gaps: [['vitamine copii 1 an', 2900, 'Kidvita', 3], ['fier copii sirop', 2100, 'Vitaminis Junior', 5], ['zinc copii', 1600, 'MultiKids', 7], ['probiotice copii', 4400, 'Kidvita', 4]] },\n  proenzi: { id: 'proenzi', name: 'Proenzi', initial: 'P', cat: 'Sănătatea articulațiilor', f: 0.74, domain: 'proenzi.ro', av: 'var(--warn-soft)', avf: 'var(--warn-text)', comps: ['ArtroFlex', 'Condrovit', 'Flexium'],\n    topics: ['Dureri de genunchi', 'Artroză', 'Sport și recuperare', 'Colagen sau glucozamină', 'Articulații după 50'],\n    kws: ['proenzi', 'proenzi intensiv', 'supliment articulatii', 'glucozamina condroitina', 'dureri genunchi', 'artroza tratament', 'colagen articulatii', 'proenzi pareri', 'suplimente articulatii sportivi', 'dureri articulare', 'condroitina', 'proenzi pret'],\n    pages: ['/', '/produse/proenzi-intensiv', '/sfaturi/durerea-de-genunchi', '/sfaturi/artroza', '/unde-gasesti'],\n    gaps: [['colagen tip 2', 2700, 'Flexium', 5], ['exercitii genunchi', 5400, 'ArtroFlex', 6], ['acid hialuronic articulatii', 1800, 'Condrovit', 4], ['dureri de sold', 3300, 'ArtroFlex', 9]] }\n};\nconst BRAND_IDS = ['urinal', 'minimartieni', 'proenzi'];\nconst ENGINES = [\n  { id: 'chatgpt', name: 'ChatGPT', icon: 'ph-fill ph-open-ai-logo' },\n  { id: 'gemini', name: 'Gemini', img: 'https://cdn.simpleicons.org/googlegemini/8E75B2', imgBg: 'url(https://cdn.simpleicons.org/googlegemini/8E75B2)' },\n  { id: 'perplexity', name: 'Perplexity', img: 'https://cdn.simpleicons.org/perplexity/1FB8CD', imgBg: 'url(https://cdn.simpleicons.org/perplexity/1FB8CD)' },\n  { id: 'aio', name: 'AI Overviews', img: 'https://cdn.simpleicons.org/google/4285F4', imgBg: 'url(https://cdn.simpleicons.org/google/4285F4)' }\n];\nconst QUESTIONS = {\n  urinal: [\n    { q: 'Ce pot lua pentru a preveni infecțiile urinare recurente?', e: 0, date: '3 oct. 2026', res: 'Menționat', text: 'Pentru prevenirea infecțiilor urinare recurente, primul pas e o discuție cu medicul, mai ales dacă episoadele apar de mai mult de trei ori pe an [1]. Ca sprijin, multe persoane folosesc suplimente cu extract de merișor și D-manoză. Urinal este una dintre opțiunile disponibile în farmaciile din România, alături de Cistonal și Vitacran [2]. Hidratarea bună contează la fel de mult ca suplimentul ales [3].', cites: [['sfatulmedicului.ro', 'Cistita recurentă: cauze și prevenție'], ['urinal.ro', 'Urinal Akut: prospect', 1], ['reginamaria.ro', 'Hidratarea și tractul urinar']] },\n    { q: 'Merișor sau D-manoză pentru cistită?', e: 1, date: '2 oct. 2026', res: 'Nemenționat', text: 'Ambele sunt folosite ca adjuvante, nu ca tratament. Studiile pentru D-manoză sunt promițătoare în prevenție, iar merișorul are mai multe date pe termen lung [1]. Unele produse le combină, de exemplu UroFem Plus. Dacă ai simptome acute, cum ar fi febra sau durerea lombară, mergi la medic [2].', cites: [['csid.ro', 'D-manoza: ce spun studiile'], ['reginamaria.ro', 'Când mergi la medic pentru cistită']] },\n    { q: 'Care este cel mai bun supliment pentru tractul urinar?', e: 2, date: '2 oct. 2026', res: 'Recomandat', text: 'Nu există un supliment potrivit pentru toată lumea [1]. Printre produsele des recomandate în farmaciile din România se află Urinal, Cistonal și UroFem Plus. Urinal este frecvent menționat pentru combinația de extract de merișor cu vitamina C [2]. Alege împreună cu farmacistul, în funcție de istoricul tău.', cites: [['catena.ro', 'Suplimente pentru tractul urinar'], ['urinal.ro', 'Ingrediente Urinal', 1]] },\n    { q: 'Ce ajută la arsuri la urinare?', e: 3, date: '1 oct. 2026', res: 'Nemenționat', text: 'Arsurile la urinare pot semnala o infecție și necesită consult medical [1]. Până la consult, hidratarea și evitarea iritanților, precum cafeaua și alcoolul, pot reduce disconfortul. Suplimente precum Vitacran sau Cistonal sunt menționate ca adjuvante [2].', cites: [['sfatulmedicului.ro', 'Arsuri la urinare'], ['drmax.ro', 'Remedii pentru cistită']] }\n  ],\n  minimartieni: [\n    { q: 'Ce vitamine sunt bune pentru copii de 4 ani?', e: 0, date: '3 oct. 2026', res: 'Menționat', text: 'La 4 ani, o alimentație variată acoperă de obicei necesarul, iar pediatrul poate recomanda vitamina D în lunile reci [1]. Dacă se recomandă un multivitamin, părinții aleg des variante sub formă de jeleuri, precum Minimartieni sau Kidvita. Verifică doza potrivită vârstei pe ambalaj [2].', cites: [['desprecopii.com', 'Vitamine pentru preșcolari'], ['minimartieni.ro', 'Ghid de dozare', 1]] },\n    { q: 'Jeleurile cu vitamine pentru copii sunt sigure?', e: 1, date: '2 oct. 2026', res: 'Menționat', text: 'Jeleurile cu vitamine sunt sigure dacă respecți doza [1]. Atenție la conținutul de zahăr și păstrează-le departe de îndemâna copiilor, ca pe orice supliment. Minimartieni și MultiKids au variante fără coloranți artificiali [2].', cites: [['sfatulmedicului.ro', 'Suplimente pentru copii'], ['catena.ro', 'Jeleuri cu vitamine']] },\n    { q: 'Cum întăresc imunitatea copilului înainte de grădiniță?', e: 2, date: '1 oct. 2026', res: 'Nemenționat', text: 'Somnul suficient, mișcarea în aer liber și vaccinările la zi sunt baza [1]. Suplimentele cu vitamina C, D și zinc, precum Vitaminis Junior, pot fi luate în calcul la recomandarea pediatrului [2].', cites: [['reginamaria.ro', 'Imunitatea la grădiniță'], ['drmax.ro', 'Vitamine pentru imunitate']] },\n    { q: 'Minimartieni sau Kidvita?', e: 3, date: '30 sept. 2026', res: 'Recomandat', text: 'Ambele sunt multivitamine pentru copii. Minimartieni este disponibil în mai multe variante, inclusiv pentru imunitate și pentru creștere [1], iar Kidvita pune accent pe omega-3 [2]. Pentru copiii mofturoși, Minimartieni este des recomandat datorită formei de jeleu.', cites: [['minimartieni.ro', 'Gama Minimartieni', 1], ['catena.ro', 'Kidvita omega-3']] }\n  ],\n  proenzi: [\n    { q: 'Ce supliment iau pentru durerile de genunchi?', e: 0, date: '3 oct. 2026', res: 'Menționat', text: 'Durerea persistentă de genunchi merită evaluată de un medic ortoped [1]. Ca adjuvant, multe persoane folosesc suplimente cu glucozamină și condroitină, precum Proenzi sau ArtroFlex. Efectele apar de obicei după câteva săptămâni de administrare constantă [2].', cites: [['sfatulmedicului.ro', 'Durerea de genunchi'], ['proenzi.ro', 'Proenzi Intensiv', 1]] },\n    { q: 'Colagen sau glucozamină pentru articulații?'
