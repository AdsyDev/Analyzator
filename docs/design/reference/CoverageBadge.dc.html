<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span title="{{ title }}" style="display:inline-flex; flex:none">
<sc-if value="{{ isComplete }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:999px; background:var(--pos-soft); color:var(--pos-text); font:500 11.5px/1 'Onest',sans-serif; white-space:nowrap"><i class="ph-bold ph-check" style="font-size:10px"></i>Complet</span></sc-if>
<sc-if value="{{ isPartial }}"><span style="display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:999px; background:var(--warn-soft); color:var(--warn-text); font:500 11.5px/1 'Onest',sans-serif; white-space:nowrap"><i class="ph-bold ph-circle-half" style="font-size:10px"></i>Parțial<span style="font:500 10.5px/1 'JetBrains Mono',monospace">{{ pctTxt }}</span></span></sc-if>
<sc-if value="{{ isStale }}"><span style="display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:999px; background:var(--neutral-soft); color:var(--text-2); font:500 11.5px/1 'Onest',sans-serif; white-space:nowrap"><i class="ph-bold ph-clock" style="font-size:10px"></i>Învechit</span></sc-if>
<sc-if value="{{ isUnavailable }}"><span style="display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:999px; background:transparent; border:1px solid var(--border-strong); color:var(--text-2); font:500 11.5px/1 'Onest',sans-serif; white-space:nowrap"><i class="ph-bold ph-plugs" style="font-size:10px"></i>Indisponibil</span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:32},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;complete&quot;,&quot;partial&quot;,&quot;stale&quot;,&quot;unavailable&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pct&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:82,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'complete';
    const pct = this.props.pct ?? 0;
    const titles = { complete: 'Date complete pentru perioada selectată', partial: 'Date parțiale: ' + pct + '% din zile acoperite', stale: 'Datele nu au mai fost actualizate de la ultimul import', unavailable: 'Sursa nu este conectată' };
    return { isComplete: s === 'complete', isPartial: s === 'partial', isStale: s === 'stale', isUnavailable: s === 'unavailable', pctTxt: pct + '%', title: titles[s] };
  }
}
</script>
</body>
</html>
