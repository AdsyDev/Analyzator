# Aplică migrațiile și redeployează Edge Functions pe proiectul Supabase la fiecare push pe main care atinge supabase/.
#
# Ordinea: întâi gate-ul complet din CLAUDE.md (typecheck, test, test:security pe un Supabase local din runner);
# doar dacă e verde, `supabase db push` pe proiectul din cloud, apoi `supabase functions deploy`.
# Aplicația web se publică separat, prin Workers Builds (wrangler.jsonc); migrațiile trebuie să fie aditive,
# pentru că cele două deploy-uri nu sunt sincronizate.
#
# Configurare în environment-ul GitHub ales (implicit „staging"):
#   Variables: SUPABASE_PROJECT_REF   (ref-ul proiectului, ex. din URL-ul https://<ref>.supabase.co)
#   Secrets:   SUPABASE_ACCESS_TOKEN  (Supabase → Account → Access Tokens)
#              SUPABASE_DB_PASSWORD   (parola bazei de date a proiectului)

name: supabase-deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment GitHub cu proiectul Supabase'
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read

concurrency:
  # Un singur deploy odată; unul pornit nu se anulează la jumătatea migrațiilor.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Dependențe
        run: npm ci && npm ci --prefix apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Teste (conectori, funcții server, analytics, apps/web)
        run: npm run test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Supabase local
        run: supabase start

      - name: Teste de securitate
        run: npm run test:security

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Verificare configurare
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Lipsesc SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD (secrete) sau SUPABASE_PROJECT_REF (variabilă) în environment-ul ${{ inputs.environment || 'staging' }}."
            exit 1
          fi

      - name: Link proiect
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrații de aplicat
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" | tee dry-run.log

      - name: Aplicare migrații
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Rezumat
        if: always()
        run: |
          {
            echo "### Supabase deploy: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            [ -f dry-run.log ] && cat dry-run.log || echo "fără output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
