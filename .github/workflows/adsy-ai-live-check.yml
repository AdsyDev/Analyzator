# Verificarea AdSy AI pe aplicația live, cap la cap (scripts/adsy-ai-live-check.ts).
#
# Creează un cont temporar (strategist, acces la un singur brand), pornește politica AdSy AI a brandului doar pe durata
# verificării, pune întrebări reale modelului, verifică refuzurile, cache-ul, controalele și generarea unei ciorne, apoi
# șterge tot ce a creat și readuce politica la starea dinainte. Datele agregate ale brandului ajung la furnizorul modelului.
#
# Se rulează doar manual. Declanșarea prin push există ca să poată fi rulat de pe ramura de lucru înainte de a ajunge în
# main: pornește numai când se schimbă fișierul-martor de mai jos.
#
# Secrete în environment-ul „staging": SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Cheia modelului NU e aici: stă în secretele
# funcției din Supabase, iar verificarea trece prin funcție, ca un utilizator.

name: adsy-ai-live-check

on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: 'ID-ul brandului verificat (gol = primul brand cu sesiuni în ultimele 28 de zile)'
        type: string
        required: false
      cleanup_only:
        description: 'Doar șterge urmele unei rulări întrerupte (fără întrebări către model)'
        type: boolean
        default: false
      chat_only:
        description: 'Doar întrebările de chat, cu motivul fiecărei respingeri (diagnostic)'
        type: boolean
        default: false
  push:
    branches: ['claude/hopeful-heisenberg-9lc7tv']
    paths: ['.github/adsy-ai-live-check.trigger']

permissions:
  contents: read

concurrency:
  group: adsy-ai-live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verificare AdSy AI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRAND_ID: ${{ inputs.brand_id }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Lipsesc secretele SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY în environment-ul staging."
            exit 1
          fi
          # Fișierul-martor poate cere doar curățarea urmelor unei rulări întrerupte.
          if grep -q '^cleanup-only' .github/adsy-ai-live-check.trigger 2>/dev/null && [ "${{ github.event_name }}" = "push" ]; then export CLEANUP_ONLY=true; fi
          if [ "${{ inputs.cleanup_only }}" = "true" ]; then export CLEANUP_ONLY=true; fi
          if grep -q '^chat-only' .github/adsy-ai-live-check.trigger 2>/dev/null && [ "${{ github.event_name }}" = "push" ]; then export CHAT_ONLY=true; fi
          if [ "${{ inputs.chat_only }}" = "true" ]; then export CHAT_ONLY=true; fi
          set -o pipefail
          node --experimental-strip-types scripts/adsy-ai-live-check.ts | tee check.log
      - name: Rezumat
        if: always()
        run: |
          {
            echo "### Verificare AdSy AI: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            [ -f check.log ] && grep -E '^(ok|PICAT|ATENȚIE|Rezultat|Rămas|Tokeni|Observații|Brand verificat|Doar curățare|Doar chat|— )' check.log || echo "fără output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
