# Colectarea zilnică din destinația Postgres a Airbyte-ului agenției (E-6, etapa 2) în paid_daily: Meta Ads, Google Ads și
# TikTok Ads, pentru conturile legate de site-uri (sursa `airbyte`).
#
# Programare: zilnic la 05:20 UTC (07:20 ora României vara, 06:20 iarna), după sincronizarea de noapte a Airbyte.
# Reimportă ultimele 35 de zile (până ieri). Citirea e read-only, prin TLS verificat; nu cheamă API-urile platformelor.
#
# Rularea programată e DEZACTIVATĂ până când variabila CONNECTOR_AIRBYTE_ENABLED = "true"
# (Settings → Secrets and variables → Actions → Variables). workflow_dispatch funcționează oricând.
#
# Secrete în environment-ul GitHub ales (implicit „staging"): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Connection string-ul Airbyte NU e aici: stă în Supabase Vault și se citește la rulare prin get_source_token.

name: airbyte-daily

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment GitHub cu secretele Supabase'
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read

concurrency:
  group: airbyte-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.CONNECTOR_AIRBYTE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependențe
        run: npm ci

      - name: Teste conector (fără rețea)
        run: node --experimental-strip-types --test 'connectors/airbyte/**/*.test.ts' 'connectors/shared/**/*.test.ts' 'supabase/functions/airbyte/**/*.test.ts'

      - name: Colectare Airbyte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Lipsesc secretele SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY în environment-ul ${{ inputs.environment || 'staging' }}."
            exit 1
          fi
          node --experimental-strip-types connectors/airbyte/collect.ts | tee collect.log

      - name: Rezumat
        if: always()
        run: |
          {
            echo "### Airbyte: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            [ -f collect.log ] && cat collect.log || echo "fără output"
            echo '```'
            echo
            echo "Detalii: sync_runs (sursa = platforma, source_connection_id = conexiunea airbyte), paid_daily."
          } >> "$GITHUB_STEP_SUMMARY"
