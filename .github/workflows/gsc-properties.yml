# Search Console: verificarea și trecerea site-urilor pe Domain property (D-27). Pașii: docs/runbook.md.
#
# mode = check (implicit): doar citire. Pentru fiecare site: proprietatea folosită, proprietățile văzute de cheia
#   clientului, ce s-ar face (switch / connect / keep / de lămurit) și estimarea reimportului pe 16 luni; plus
#   spațiul bazei de date, dacă environment-ul are tokenul de deploy Supabase.
# mode = apply: trece site-urile din `brands` pe Domain property (doar când cheia o vede și proprietatea veche ține
#   de același domeniu), apoi colectează Search Console pentru fiecare: de la `from` (reimport) sau ultimele 35 de zile.
#   Toate site-urile se verifică înainte de prima scriere; unul nepregătit oprește tot.
#
# Secrete în environment-ul ales: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (ca la colectori); opțional
# SUPABASE_ACCESS_TOKEN și variabila SUPABASE_PROJECT_REF (ca la supabase-deploy), doar pentru dimensiunea bazei.

name: gsc-properties

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment GitHub cu secretele Supabase'
        type: choice
        options: [staging]
        default: staging
      mode:
        description: 'check = doar citire; apply = trece site-urile din brands pe Domain property'
        type: choice
        options: [check, apply]
        default: check
      brands:
        description: 'apply: ID-urile site-urilor (din /admin/clients/<id>), separate prin spațiu sau virgulă'
        type: string
        default: ''
      from:
        description: 'apply: reimport Search Console de la această zi (YYYY-MM-DD, cel mult 16 luni în urmă); gol = ultimele 35 de zile'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Același grup ca google-weekly: trecerea și colectarea Search Console nu rulează în același timp.
  group: google-weekly
  cancel-in-progress: false

jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependențe
        run: npm ci

      - name: Teste conector (fără rețea)
        run: node --experimental-strip-types --test 'connectors/google/**/*.test.ts' 'connectors/shared/**/*.test.ts' 'supabase/functions/source-credentials/discover.test.ts'

      - name: Spațiul bazei de date (doar citire)
        if: inputs.mode == 'check'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Fără SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF: dimensiunea bazei nu se citește." | tee db-size.log
            exit 0
          fi
          SQL="select pg_size_pretty(pg_database_size(current_database())) as baza,
                      pg_database_size(current_database()) as baza_bytes,
                      pg_size_pretty(pg_total_relation_size('public.search_queries')) as search_queries,
                      pg_total_relation_size('public.search_queries') as search_queries_bytes,
                      (select count(*) from public.search_queries) as search_queries_randuri"
          BODY=$(jq -n --arg q "$SQL" '{query: $q}')
          if curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY" -o db-size.json; then
            jq -r '.[0] | to_entries[] | "\(.key): \(.value)"' db-size.json | tee db-size.log
          else
            echo "Dimensiunea bazei nu s-a putut citi (Management API)." | tee db-size.log
          fi

      - name: Search Console
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Câmpurile text trec prin mediu, nu direct în script (fără injecție de comenzi); scriptul le validează.
          MODE: ${{ inputs.mode }}
          BRANDS: ${{ inputs.brands }}
          FROM: ${{ inputs.from }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Lipsesc secretele SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          ARGS=()
          if [ "$MODE" = "apply" ]; then
            ARGS+=(--apply)
            IFS=', ' read -ra LIST <<< "$BRANDS"
            for b in "${LIST[@]}"; do
              if [ -n "$b" ]; then ARGS+=(--brand "$b"); fi
            done
            if [ -n "$FROM" ]; then ARGS+=(--from "$FROM"); fi
          fi
          node --experimental-strip-types connectors/google/gsc-properties.ts "${ARGS[@]}" | tee gsc.log

      - name: Rezumat
        if: always()
        run: |
          {
            echo "### Search Console: ${{ inputs.mode }} ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo '```'
            [ -f db-size.log ] && cat db-size.log && echo
            [ -f gsc.log ] && cat gsc.log || echo "fără output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
